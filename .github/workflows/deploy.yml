name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main  # Zmień na 'master', jeśli tak nazywa się Twoja główna gałąź

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Logowanie do ACR
      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: cacaproject.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 2. Budowanie i wysyłanie obrazu Docker do ACR
      - name: Build and push Docker image
        run: |
          docker build -t cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }} .
          docker push cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}

      # 3. Bezpośrednia aktualizacja Container App za pomocą oficjalnej akcji z loginem ACR
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: cacaproject
          acrUsername: ${{ secrets.REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.REGISTRY_PASSWORD }}
          containerAppName: pizzawsb2
          resourceGroup: WSBMerito
          imageToDeploy: cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}