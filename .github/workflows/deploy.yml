name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main  # Zmień na master, jeśli tak się nazywa Twój główny branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Logowanie do ACR przy użyciu danych administratora
      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: cacaproject.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 2. Budowanie i wysyłanie obrazu do Twojego ACR
      - name: Build and push Docker image
        run: |
          docker build -t cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }} .
          docker push cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}

      # 3. Aktualizacja Azure Container Apps za pomocą Azure CLI w akcji GitHub
      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name pizzawsb2 \
              --resource-group WSBMerito \
              --image cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}