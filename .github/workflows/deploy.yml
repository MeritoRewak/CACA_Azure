name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main  # lub master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Logowanie do ACR przy użyciu sekretów administratora
      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: cacaproject.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 2. Budowanie i wysyłanie obrazu do ACR
      - name: Build and push Docker image
        run: |
          docker build -t cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }} .
          docker push cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}

      # 3. Aktualizacja aplikacji przez ACR credentials bezpośrednio w CLI (bez az login)
      - name: Update ACA Image
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp registry set \
              --name pizzawsb2 \
              --resource-group WSBMerito \
              --server cacaproject.azurecr.io \
              --username ${{ secrets.REGISTRY_USERNAME }} \
              --password ${{ secrets.REGISTRY_PASSWORD }}
            
            az containerapp update \
              --name pizzawsb2 \
              --resource-group WSBMerito \
              --image cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}