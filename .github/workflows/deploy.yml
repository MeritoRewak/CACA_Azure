name: Build and Push to Azure Container Registry

on:
  push:
    branches:
      - main  # lub master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Logowanie do ACR (używa kluczy admina, działa bezbłędnie)
      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: cacaproject.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 2. Budowanie i wysyłanie obrazu Docker do ACR
      - name: Build and push Docker image
        run: |
          docker build -t cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }} .
          docker push cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}